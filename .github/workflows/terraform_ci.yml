name: Terraform CI

on: pull_request

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -recursive -check
        working-directory: ./

      # The EC2 API, not the Terraform schema, enforces the character set for
      # security-group rule descriptions. `validate` passes and the apply fails,
      # so this has to be its own check.
      - name: Security-group rule descriptions
        run: ./scripts/check-sg-rule-descriptions.sh aws

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # zstd is what DirectAdmin compresses backups with, and the archive-integrity
        # proofs build real .tar.zst fixtures and truncate them. Without it those proofs
        # would skip the check they exist to test and still print OK.
        run: sudo apt-get update && sudo apt-get install -y shellcheck zstd
      - name: bash -n
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts aws/docs .cursor -type f -name '*.sh' -print0)
      - name: shellcheck
        run: |
          set -euo pipefail
          # SC1091: sourced runtime confs are not in-repo.
          # Severity error only so pre-existing info/warnings in older scripts
          # do not block PRs; new bugs that are errors still fail the job.
          find scripts aws/docs .cursor -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -S error -x -e SC1091
      - name: Offline vhost-listen detector proof
        run: ./scripts/directadmin/prove_vhost_listen_detector.sh
      - name: Offline backup cleanup proof
        run: ./scripts/directadmin/prove_backup_cleanup.sh
      - name: Offline per-account backup batching proof
        run: ./scripts/directadmin/prove_backup_batch.sh
      - name: Offline site media archive proof
        run: ./scripts/directadmin/prove_site_media.sh
      - name: Offline deploy-drift proof
        run: bash ./scripts/directadmin/prove_install_verify.sh
      - name: Offline disk evidence verdict proof
        run: ./aws/docs/prove-outage-evidence-verdict.sh
      # boto3 is deliberately not installed: the proof stubs it, so a missing SDK
      # cannot be the reason this passes.
      - name: Offline SES forward header proof
        run: ./scripts/directadmin/prove_ses_gmail_forward.py
      - name: Offline SES forward health proof
        run: ./scripts/directadmin/prove_ses_gmail_health.sh
      # jmespath is installed explicitly rather than relied on from the runner's
      # awscli: one case evaluates the audit's own security-group query, and it
      # has to be the same engine the CLI uses for the result to mean anything.
      - name: Offline host access audit proof
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check jmespath
          ./scripts/directadmin/prove_host_access_audit.sh

  validate:
    name: Validate (${{ matrix.workspaces }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspaces:
          - aws
          - github
          - tfc
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}

      - name: Terraform init
        id: init
        run: terraform init
        working-directory: ./${{ matrix.workspaces }}
        env:
          GIT_SSH_COMMAND: "echo '${{ secrets.GH_SSH_PRIVATE_KEY }}' > id_rsa
            && ssh-keyscan github.com > known_hosts
            && chmod 600 id_rsa known_hosts
            && ssh -i ./id_rsa -o UserKnownHostsFile=./known_hosts"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ./${{ matrix.workspaces }}
