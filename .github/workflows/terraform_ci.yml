name: Terraform CI

on: pull_request

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -recursive -check
        working-directory: ./

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts aws/docs -type f -name '*.sh' -print0)
      - name: shellcheck
        run: |
          set -euo pipefail
          # SC1091: sourced runtime confs are not in-repo.
          # Severity error only so pre-existing info/warnings in older scripts
          # do not block PRs; new bugs that are errors still fail the job.
          find scripts aws/docs -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -S error -x -e SC1091
      - name: Offline vhost-listen detector proof
        run: ./scripts/directadmin/prove_vhost_listen_detector.sh

  validate:
    name: Validate (${{ matrix.workspaces }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspaces:
          - aws
          - github
          - tfc
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}

      - name: Terraform init
        id: init
        run: terraform init
        working-directory: ./${{ matrix.workspaces }}
        env:
          GIT_SSH_COMMAND: "echo '${{ secrets.GH_SSH_PRIVATE_KEY }}' > id_rsa
            && ssh-keyscan github.com > known_hosts
            && chmod 600 id_rsa known_hosts
            && ssh -i ./id_rsa -o UserKnownHostsFile=./known_hosts"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ./${{ matrix.workspaces }}
